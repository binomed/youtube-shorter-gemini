name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run all tests
        run: npm run test
      
      - name: Generate coverage reports
        run: |
          npm run test:cov --workspace=back || true
          npm run test:coverage --workspace=front || true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/back/coverage/
            apps/front/coverage/
          retention-days: 30
  
  basic-accessibility-checks:
    # Note: Basic a11y validation in happy-dom. Comprehensive browser-based 
    # WCAG 2.1 AA audits with Playwright + axe-core planned for Epic 2
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run basic accessibility checks
        run: npm run test:a11y --workspace=front

