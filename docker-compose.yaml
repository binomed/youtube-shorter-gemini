services:
  youtube-shorter:
    build:
      context: .
      dockerfile: Dockerfile
    image: youtube-shorter:latest
    shm_size: 2gb
    ports:
      - "3000:3000"
    volumes:
      # Data & Uploads
      - ./apps/back/data:/app/apps/back/data
      - ./apps/back/uploads:/app/apps/back/uploads
      - ./apps/back/logs:/app/apps/back/logs
      # Advanced Model Caching: Persist Demucs AI models to avoid re-downloads (~1GB)
      - htdemucs_models:/home/appuser/.cache/htdemucs
      - whisper_models:/home/appuser/.cache/whisper
      - torch_models:/home/appuser/.cache/torch
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WHISPER_BATCH_SIZE=1 
      - WHISPER_MODEL=tiny
      - WHISPER_COMPUTE_TYPE=float32
      - WHISPER_DEVICE=cpu
      - OMP_NUM_THREADS=1 # Limit parallelism to reduce memory overhead
      - MKL_NUM_THREADS=1
      
      # --- TRANSCRIPTION PROFILE ---
      # Set to 'true' for Cloud/Portable mode (Low RAM)
      # Set to 'false' for Local/Precision mode (High RAM, requires WhisperX)
      - USE_GEMINI_SUBTITLES=false 
    restart: unless-stopped
    init: true
    # Reliability: Resource limits
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '2.0'
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/projects/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  htdemucs_models:
  whisper_models:
  torch_models:
